name: MasterFabric HF Pipeline Automation

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual execution'
        required: false
        default: 'Manual trigger'

jobs:
  deploy-dataset-and-model:
    name: Sync Prompt Dataset & Model to Hugging Face
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas datasets huggingface_hub

      - name: Push Dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/push_to_huggingface.py

      - name: Push LoRA Model Adapter to Hugging Face Hub (Optional)
        if: ${{ hashFiles('peft-adapters/gemma-journal-custom-lora/adapter_model.safetensors') != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/push_model_to_huggingface.py
